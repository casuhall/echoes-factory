<!doctype html>
<html lang="fr">

<head>
  <title>Gestion de l'usine</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="./style/style.css" />
  <style>
    #stock-table td:nth-child(2) {
      text-align: end;
    }
  </style>
</head>

<body>
  <nav>
    <div>
      <span class="h1" id="nav-nomUsine">[Nom de l'usine]</span>
      <a href="/" class="btn ghost" id="nav-accueil">Accueil</a>
      <a href="/marché.html" class="btn ghost" id="nav-marché">Marché</a>
      <a href="/produits.html" class="btn ghost" id="nav-produits">Produits</a>
      <a href="/stock.html" class="btn" id="nav-stock">Stock</a>
    </div>
  </nav>

  <dialog id="ajout_unitaire_modal">
    <form method="dialog">
      <h2>Enregistrer un objet</h2>
      <div>
        <div class="grid">
          <div class="grid">
            <label for="nom_article_unitaire_input" class="form-label">Nom de l'objet</label>
            <input type="text" id="nom_article_unitaire_input" class="form-control" />
          </div>
          <div class="grid">
            <label for="nombre_article_unitaire_input">Nombre d'objets à ajouter au stock</label>
            <input type="number" step="1" id="nombre_article_unitaire_input" />
          </div>
        </div>
        <div class="grid">
          <input id="btn_annuler_unitaire" type="submit" formnovalidate class="btn ghost" value="Annuler" />
          <input id="btn_enregistrer_unitaire" type="submit" class="btn" value="Enregistrer" />
        </div>
    </form>
  </dialog>
  <dialog id="modif_modal">
    <form method="dialog">
      <h5 id="modif_title">Modifier les stocks de l'objet</h5>
      <div class="grid">
        <input type="number" step="1" id="nombre_article_modif_input"
          placeholder="Nombre d'objets à ajouter/retirer du stock" />
      </div>
      <div class="grid">
        <input id="btn_enregistrer_modif" type="submit" class="btn" value="Enregistrer" />
        <input id="btn_annuler_modif" type="submit" formnovalidate class="btn ghost" value="Annuler" />
      </div>
    </form>
  </dialog>
  <dialog id="ajout_massif_modal">
    <h5>Ajouts d'objets en masse !</h5>
    <form method="dialog">
      <div class="grid">
        <label for="saisie_massif_input" class="form-label">Lot d'objets à ajouter au stock</label>
        <textarea id="saisie_massif_input" class="form-control"></textarea>
      </div>
      <div class="grid">
        <input id="btn_annuler_massif" type="submit" formnovalidate class="btn ghost" value="Annuler" />
        <input id="btn_enregistrer_massif" type="submit" class="btn" value="Enregistrer" />
      </div>
    </form>
  </dialog>

  <main>
    <div class="grid">
      <button command="show-modal" commandfor="ajout_unitaire_modal" class="btn">Ajouter un objet</button>
      <button command="show-modal" commandfor="ajout_massif_modal" class="btn">Ajouter en masse</button>
      <button id="btn_reset_stock" type="button" class="btn warning">Réinitialiser</button>
    </div>
    <section class="grid">
      <h3>Liquidités disponibles</h3>
      <P id="p-liquidités" class="right"></P>
      <input type="number" step="1" min="0" id="liquidités_input" class="right" hidden />
    </section>
    <section>
      <div class="grid">
        <h3>Objets en stock</h3>
        <input type="text" name="Search" id="search_input" placeholder="Rechercher un objet..." />
      </div>
      <table class="table" id="stock-table">
        <thead>
          <tr>
            <th>Nom</th>
            <th>Quantité</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="stock-body">
          <tr>
            <td class="empty" colspan="3">Aucun objet en stock</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <script type="module">
    import { Usine, GestionnaireEvenements } from "./app/service.js"
    import {
      decodeEchoesListe, UNICODE_DATE_FORMAT, NUMBER_FORMAT,
      initialiserElement, prépareNotification, notifier
    } from "./app/presentation.js"
    prépareNotification();

    // Binding des éléments d'IHM
    const nomUsine = document.getElementById('nav-nomUsine');
    const BOUTON_RESET = document.getElementById("btn_reset_stock");
    const NOTIF = document.getElementById("notification");
    const INPUT_NOM_ARTICLE_UNITAIRE = document.getElementById("nom_article_unitaire_input");
    const INPUT_PRIX_ARTICLE_UNITAIRE = document.getElementById("nombre_article_unitaire_input");
    const BOUTON_ANNULER_UNITAIRE = document.getElementById("btn_annuler_unitaire");
    const BOUTON_ENREGISTRER_UNITAIRE = document.getElementById("btn_enregistrer_unitaire");
    const INPUT_MASSIF = document.getElementById("saisie_massif_input");
    const BOUTON_ANNULER_MASSIF = document.getElementById("btn_annuler_massif");
    const BOUTON_ENREGISTRER_MASSIF = document.getElementById("btn_enregistrer_massif");
    const STOCK_TABLE_BODY = document.getElementById("stock-body");
    const INPUT_LIQUIDITÉS = document.getElementById("liquidités_input");

    let usine;
    let storedUsine = localStorage.getItem("usine");
    if (storedUsine) {
      usine = Usine.parse(storedUsine);
    }
    else {
      usine = new Usine("ChangeIt", undefined, [], [], []);
    }

    nomUsine.textContent = usine.nom;

    BOUTON_RESET.addEventListener("click", () => {
      usine.liquidités = 0;
      usine.destocker();
      updateStorage();
      présenterStock();
    });

    préparerSaisieUnitaire();
    préparerSaisieMassive();
    présenterLiquidités();
    présenterStock();

    // Fonction de réparation de la fenêtre modale de saisie unitaire
    function préparerSaisieUnitaire() {
      // Action à réaliser sur le click du bouton enregister
      BOUTON_ENREGISTRER_UNITAIRE.addEventListener("click", () => {
        // Propager l'évaluation dans l'usine
        usine.stocker(INPUT_NOM_ARTICLE_UNITAIRE.value, INPUT_PRIX_ARTICLE_UNITAIRE.value);
        // Persister l'état de l'usine
        updateStorage();
        // Mettre ajour l'affichage
        présenterStock();
      });

      // Action à réaliser sur le click du bouton annuler
      BOUTON_ANNULER_UNITAIRE.addEventListener("click", () => {
        INPUT_NOM_ARTICLE_UNITAIRE.value = null;
        INPUT_PRIX_ARTICLE_UNITAIRE.value = null;
      });
    }

    // Fonction de préparation de la saisie en masse
    function préparerSaisieMassive() {
      BOUTON_ENREGISTRER_MASSIF.addEventListener("click", () => {
        let liste = decodeEchoesListe(INPUT_MASSIF.value);
        for (const stack of liste) {
          try {
            usine.stocker(stack.nom, stack.quantité);
            usine.évaluer(stack.nom, stack.valeur / stack.quantité);
          } catch (erreur) {
            console.error("Échec à l'ajout de l'article au stock ", stack, erreur);
          }
        }
        // Persister l'état de l'usine
        updateStorage();
        // Mettre ajour l'affichage
        présenterStock();
        INPUT_MASSIF.value = null;
      });
    }

    function présenterLiquidités() {
      document.getElementById("p-liquidités").textContent = NUMBER_FORMAT.format(usine.liquidités, "integer");
      document.getElementById("p-liquidités").addEventListener("click", (event) => {
        event.target.hidden = true;
        INPUT_LIQUIDITÉS.value = usine.liquidités;
        INPUT_LIQUIDITÉS.hidden = false;
      });
      INPUT_LIQUIDITÉS.addEventListener("blur", (event) => {
        usine.liquidités = INPUT_LIQUIDITÉS.value;
        updateStorage();
        event.target.hidden = true;
        document.getElementById("p-liquidités").textContent = NUMBER_FORMAT.format(usine.liquidités, "integer");
        document.getElementById("p-liquidités").hidden = false;
      });
    }

    // Fonction d'affichage du tableau à partir des données de l'usine
    function présenterStock() {
      if (usine.stock.length === 0) {
        STOCK_TABLE_BODY.innerHTML = "<tr><td class='empty' colspan='3'>Inventaire désepérément vide</td></tr>";
      } else {
        STOCK_TABLE_BODY.replaceChildren();
      }

      const fragment = document.createDocumentFragment();
      for (const article of usine.stock) {
        const ligne = initialiserElement("tr");
        const nom = initialiserElement("td", [], article.nom);
        const quantité = initialiserElement("td", ["text-end"], NUMBER_FORMAT.format(article.quantité, "integer"));

        const actions = initialiserElement("td");
        const modifier = initialiserElement("button", ["btn", "btn-primary"], "✎", [{
          trigger: "click", listener: () => {
            document.getElementById("modif_title").textContent = `Modifier les stocks de l'objet "${article.nom}" (quantité actuelle : ${NUMBER_FORMAT.format(article.quantité, "integer")})`;
            document.getElementById("btn_enregistrer_modif").onclick = () => {
              try {
                let quantité = parseInt(document.getElementById("nombre_article_modif_input").value);
                if (quantité > 0) {
                  usine.stocker(article.nom, quantité);
                } else if (quantité < 0) {
                  usine.destocker(article.nom, -quantité);
                }
                updateStorage();
                présenterStock();
              } catch (error) {
                notifier(error.message, "error");
              }
            }
          }
        }]);
        modifier.setAttribute("command", "show-modal");
        modifier.setAttribute("commandfor", "modif_modal");
        const supprimer = initialiserElement("button", ["btn", "warning"], "🗑", [{
          trigger: "click", listener: () => {
            try {
              if (confirm(`Êtes-vous sûr de vouloir supprimer l'objet "${article.nom}" ?`)) {
                usine.destocker(article.nom);
                updateStorage();
                présenterStock();
              }
            } catch (error) {
              notifier(error.message, "error");
            }
          }
        }]);
        actions.appendChild(modifier);
        actions.appendChild(supprimer);
        ligne.append(nom, quantité, actions);
        fragment.appendChild(ligne);
      }
      STOCK_TABLE_BODY.appendChild(fragment);
    }

    // Fonction de stockage des données de l'usine
    function updateStorage() {
      localStorage.setItem("usine", usine.toString());
    }

  </script>
</body>

</html>
