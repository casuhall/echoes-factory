<!doctype html>
<html lang="fr" data-bs-theme="dark">

<head>
  <title>Gestion de l'usine</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="./style/style.css" />
  <style>
    #tarifs-table td:nth-child(2) {
      text-align: end;
    }
  </style>
</head>

<body>
  <nav>
    <div>
      <span class="h1" id="nav-nomUsine">[Nom de l'usine]</span>
      <a href="./index.html" class="btn ghost" id="nav-accueil">Accueil</a>
      <a href="./marché.html" class="btn" id="nav-marché">Marché</a>
      <a href="./produits.html" class="btn ghost" id="nav-produits">Produits</a>
      <a href="./stock.html" class="btn ghost" id="nav-stock">Stock</a>
    </div>
  </nav>


  <dialog id="ajout_unitaire_modal">
    <form method="dialog">
      <h2>Enregistrer un prix</h2>
      <div class="grid">
        <div>
          <label for="nom_article_unitaire_input" class="form-label">Nom de l'article</label>
          <input type="text" id="nom_article_unitaire_input" class="form-control" />
        </div>
        <div>
          <label for="prix_article_unitaire_input">Prix de l'article</label>
          <input type="number" step="0.01" id="prix_article_unitaire_input" />
        </div>
        <input id="btn_annuler_unitaire" type="submit" formnovalidate class="btn ghost" value="Annuler" />
        <input id="btn_enregistrer_unitaire" type="submit" class="btn" value="Enregistrer" />
      </div>
    </form>
  </dialog>
  <dialog id="ajout_massif_modal">
    <h5>Mise à jour de tarifs en masse !</h5>
    <form method="dialog">
      <div class="grid">
        <label for="saisie_massif_input" class="form-label">Lot d'objets à évaluer</label>
        <textarea id="saisie_massif_input" class="form-control"></textarea>
      </div>
      <div class="grid">
        <input id="btn_annuler_massif" type="submit" formnovalidate class="btn ghost" value="Annuler" />
        <input id="btn_enregistrer_massif" type="submit" class="btn" value="Enregistrer" />
      </div>
    </form>
    </div>
  </dialog>

  <main>
    <div class="grid">
      <button command="show-modal" commandfor="ajout_unitaire_modal" class="btn">Enregistrer un prix</button>
      <button command="show-modal" commandfor="ajout_massif_modal" class="btn">Enregistrer en masse</button>
    </div>

    <div class="grid">
      <input type="search" id="recherche-tarifs" class="form-control" placeholder="Rechercher par nom…" />
    </div>

    <table class="table" id="tarifs-table">
      <thead>
        <tr>
          <th id="th-nom" style="cursor:pointer" data-col="nom">Nom</th>
          <th id="th-prix" style="cursor:pointer" data-col="prix">Prix</th>
          <th id="th-date" style="cursor:pointer" data-col="date">Date d'effet</th>
        </tr>
      </thead>
      <tbody id="tarifs-body"></tbody>
    </table>
  </main>

  <script type="module">
    import { Usine, GestionnaireEvenements } from "./app/service.js"
    import {
      decodeEchoesListe, UNICODE_DATE_FORMAT, NUMBER_FORMAT,
      initialiserElement, notifier
    } from "./app/presentation.js"
    import { filtrerTarifs, trierTarifs } from "./app/marchéSortFilter.js"

    // Binding des éléments d'IHM
    const nomUsine = document.getElementById('nav-nomUsine');
    const INPUT_NOM_ARTICLE_UNITAIRE = document.getElementById("nom_article_unitaire_input");
    const INPUT_PRIX_ARTICLE_UNITAIRE = document.getElementById("prix_article_unitaire_input");
    const BOUTON_ANNULER_UNITAIRE = document.getElementById("btn_annuler_unitaire");
    const BOUTON_ENREGISTRER_UNITAIRE = document.getElementById("btn_enregistrer_unitaire");
    const INPUT_MASSIF = document.getElementById("saisie_massif_input");
    const BOUTON_ANNULER_MASSIF = document.getElementById("btn_annuler_massif");
    const BOUTON_ENREGISTRER_MASSIF = document.getElementById("btn_enregistrer_massif");
    const TARIF_TABLE_BODY = document.getElementById("tarifs-body");
    const RECHERCHE_INPUT = document.getElementById("recherche-tarifs");
    const TH_NOM = document.getElementById("th-nom");
    const TH_PRIX = document.getElementById("th-prix");
    const TH_DATE = document.getElementById("th-date");

    // État local de tri — { col: "nom"|"prix"|"date", dir: "asc"|"desc" } | null
    let triEtat = null;

    let usine;
    let storedUsine = localStorage.getItem("usine");
    if (storedUsine) {
      usine = Usine.parse(storedUsine);
    }
    else {
      usine = new Usine("ChangeIt", undefined, [], [], []);
    }

    nomUsine.textContent = usine.nom;
    préparerSaisieUnitaire();
    préparerSaisieMassive();
    préparerTriEtRecherche();
    présenterTarifs();


    // Fonction de réparation de la fenêtre modale de saisie unitaire
    function préparerSaisieUnitaire() {
      // Action à réaliser sur le click du bouton enregister
      BOUTON_ENREGISTRER_UNITAIRE.addEventListener("click", () => {
        // Propager l'évaluation dans l'usine
        usine.évaluer(INPUT_NOM_ARTICLE_UNITAIRE.value, INPUT_PRIX_ARTICLE_UNITAIRE.value);
        // Persister l'état de l'usine
        updateStorage();
        // Mettre ajour l'affichage
        présenterTarifs();
      });

      // Action à réaliser sur le click du bouton annuler
      BOUTON_ANNULER_UNITAIRE.addEventListener("click", () => {
        INPUT_NOM_ARTICLE_UNITAIRE.value = null;
        INPUT_PRIX_ARTICLE_UNITAIRE.value = null;
      });
    }

    // Fonction de préparation de la saisie en masse
    function préparerSaisieMassive() {
      BOUTON_ENREGISTRER_MASSIF.addEventListener("click", () => {
        let liste = decodeEchoesListe(INPUT_MASSIF.value);
        for (const stack of liste) {
          try {
            usine.évaluer(stack.nom, stack.valeur / stack.quantité);
          } catch (erreur) {
            console.error("Échec à l'évaluation du prix", stack, erreur);
          }
        }
        // Persister l'état de l'usine
        updateStorage();
        // Mettre ajour l'affichage
        présenterTarifs();
      });
    }

    // Fonction d'affichage du tableau à partir des données de l'usine
    function présenterTarifs() {
      const filtre = RECHERCHE_INPUT ? RECHERCHE_INPUT.value : "";

      // Filtrage par nom (partiel, insensible à la casse)
      let tarifs = filtrerTarifs(usine.tarifs, filtre);

      // Tri par colonne
      if (triEtat) {
        const { col, dir } = triEtat;
        tarifs = trierTarifs(tarifs, col, dir);
      }

      let html_tarif = (tarifs.length > 0) ? "\n" : "<tr><td class='text-center' colspan='3'>Aucun tarif enregistré</td></tr>";
      for (const tarif of tarifs) {
        html_tarif += `<tr><td>${tarif.nom}</td><td class="text-end">${NUMBER_FORMAT.format(tarif.montant)}</td><td class="right">${UNICODE_DATE_FORMAT.format(tarif.date_effet)}</td></tr>\n`
      }
      TARIF_TABLE_BODY.innerHTML = html_tarif;

      // Mise à jour des indicateurs visuels de tri
      mettreAJourIndicateursTri();
    }

    // Mise à jour des flèches de tri dans les en-têtes
    function mettreAJourIndicateursTri() {
      const ths = { nom: TH_NOM, prix: TH_PRIX, date: TH_DATE };
      const labels = { nom: "Nom", prix: "Prix", date: "Date d'effet" };
      for (const [col, th] of Object.entries(ths)) {
        if (!th) continue;
        if (triEtat && triEtat.col === col) {
          th.textContent = labels[col] + " " + (triEtat.dir === "asc" ? "▲" : "▼");
        } else {
          th.textContent = labels[col];
        }
      }
    }

    // Branchement du tri par colonne et du champ de recherche
    function préparerTriEtRecherche() {
      // Tri par clic sur les en-têtes
      for (const th of [TH_NOM, TH_PRIX, TH_DATE]) {
        th.addEventListener("click", () => {
          const col = th.dataset.col;
          if (triEtat && triEtat.col === col) {
            triEtat = { col, dir: triEtat.dir === "asc" ? "desc" : "asc" };
          } else {
            triEtat = { col, dir: "asc" };
          }
          présenterTarifs();
        });
      }

      // Recherche en temps réel
      RECHERCHE_INPUT.addEventListener("input", () => {
        présenterTarifs();
      });
    }

    // Fonction de stockage des données de l'usine
    function updateStorage() {
      localStorage.setItem("usine", usine.toString());
    }

  </script>
  <!-- End Example Code -->
</body>

</html>
