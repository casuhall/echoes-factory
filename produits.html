<!doctype html>
<html lang="fr">

<head>
  <title>Catalogue des Produits</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="./style/style.css" />
</head>

<body>
  <nav>
    <div>
      <span class="h1" id="nav-nomUsine">[Nom de l'usine]</span>
      <a href="./index.html" class="btn ghost" id="nav-accueil" data-i18n="nav.accueil">Accueil</a>
      <a href="./marché.html" class="btn ghost" id="nav-marché" data-i18n="nav.marché">Marché</a>
      <a href="./produits.html" class="btn" id="nav-produits" data-i18n="nav.produits">Produits</a>
      <a href="./stock.html" class="btn ghost" id="nav-stock" data-i18n="nav.stock">Stock</a>
      <a href="./planification.html" class="btn ghost" id="nav-planification" data-i18n="nav.planification">Planification</a>
      <select id="select-langue" style="margin-left: 8px; padding: 2px 8px; font-size: 0.85em; width: auto;">
      </select>
    </div>
  </nav>
  <main id="ajoutProduitMain">
    <h1 data-i18n="produits.titre">Catalogue des Produits de l'Usine</h1>
    <div class="actions">
      <a href="./edition_produit.html" class="btn" data-i18n="produits.ajouterProduit">Ajouter un produit</a>
    </div>
    <div class="grid" style="margin-bottom:12px;">
      <input type="text" id="search_produits" placeholder="Rechercher un produit..." data-i18n-placeholder="produits.rechercher" />
    </div>
    <div>
      <table>
        <thead>
          <tr>
            <th id="th-nom" style="cursor:pointer;user-select:none;" data-i18n="produits.produit">Produit</th>
            <th id="th-rentabilité" style="cursor:pointer;user-select:none;" data-i18n="produits.rentabilité">Rentabilité</th>
            <th id="th-gain" style="cursor:pointer;user-select:none;" data-i18n="produits.gain">Gain estimé</th>
            <th data-i18n="produits.commentaire">Commentaire</th>
            <th data-i18n="produits.refTarif">Réf. tarif</th>
            <th data-i18n="produits.actions">Actions</th>
          </tr>
        </thead>
        <tbody id="produitsBody">
          <tr class="empty">
            <td colspan="6" data-i18n="produits.aucunProduit">Aucun produit défini</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
  <script type="module">
    import { Usine } from "./app/service.js"
    import {
      decodeEchoesListe, UNICODE_DATE_FORMAT, NUMBER_FORMAT,
      initialiserElement, notifier, prépareNotification
    } from "./app/presentation.js"
    import { filtrerProduits, trierProduits } from "./app/produitsSortFilter.js"
    import { estPérimé } from "./app/péremption.js"
    import { Stockage } from "./app/storage.js"
    import { i18n } from "./app/i18n.js"

    prépareNotification();
    await i18n.charger();

    const stockage = new Stockage(Stockage.lirePantryId());
    const usine = Usine.parse(await stockage.lireUsine() || "{}");
    document.getElementById("nav-nomUsine").innerText = usine.nom;

    const corpsTableauProduits = document.getElementById('produitsBody');
    const searchInput = document.getElementById('search_produits');

    // Seuil configurable de péremption des estimations (en jours)
    const SEUIL_PÉREMPTION_JOURS = 7;

    // État de tri : { colonne: 'nom'|'rentabilité'|'gain', direction: 'asc'|'desc' }
    let triCourant = { colonne: null, direction: 'asc' };

    const COLONNES_TRIABLES = {
      'th-nom':         { clé: 'nom' },
      'th-rentabilité': { clé: 'rentabilité' },
      'th-gain':        { clé: 'gain' },
    };

    // Mise à jour des indicateurs visuels sur les en-têtes
    function mettreÀJourIndicateurs() {
      for (const id of Object.keys(COLONNES_TRIABLES)) {
        const th = document.getElementById(id);
        const clé = COLONNES_TRIABLES[id].clé;
        if (triCourant.colonne === clé) {
          th.textContent = th.textContent.replace(/ [▲▼]$/, '');
          th.textContent += triCourant.direction === 'asc' ? ' ▲' : ' ▼';
        } else {
          th.textContent = th.textContent.replace(/ [▲▼]$/, '');
        }
      }
    }

    // Attacher les écouteurs de clic sur les en-têtes triables
    for (const [id, config] of Object.entries(COLONNES_TRIABLES)) {
      document.getElementById(id).addEventListener('click', () => {
        if (triCourant.colonne === config.clé) {
          triCourant.direction = triCourant.direction === 'asc' ? 'desc' : 'asc';
        } else {
          triCourant.colonne = config.clé;
          triCourant.direction = 'asc';
        }
        mettreÀJourIndicateurs();
        afficherProduits();
      });
    }

    // Filtrer et trier les produits, puis rendre le tableau
    function afficherProduits() {
      const filtre = searchInput.value.trim();

      let produitsFiltrésTriés = filtrerProduits(usine.produits, filtre);

      if (triCourant.colonne !== null) {
        produitsFiltrésTriés = trierProduits(produitsFiltrésTriés, triCourant.colonne, triCourant.direction);
      }

      if (produitsFiltrésTriés.length === 0) {
        corpsTableauProduits.innerHTML = `<tr class="empty"><td colspan="6">${
          filtre ? i18n.t('produits.aucunResultat') : i18n.t('produits.aucunProduit')
        }</td></tr>`;
        return;
      }

      corpsTableauProduits.innerHTML = "";
      produitsFiltrésTriés.forEach(produit => {
        const ligne = document.createElement("tr");
        ligne.innerHTML = `
          <td>${produit.nom}</td>
          <td class="right">${NUMBER_FORMAT.format(produit.rentabilité * 100)} %</td>
          <td class="${(produit.statut === "BUY") ? "red" : "green"} right">${NUMBER_FORMAT.format(((produit.prix_estimé ?? 0) * (produit.recette?.quantité_produite ?? 1)) - ((produit.coût_reviens ?? 0) / (produit.recette?.chances_de_succès ?? 1)))}</td>
          <td>${produit.commentaire || ''}</td>
          <td class="right${estPérimé(produit.date_référence_estimations, SEUIL_PÉREMPTION_JOURS) ? ' tarif-périmé' : ''}">${produit.date_référence_estimations ? UNICODE_DATE_FORMAT.format(produit.date_référence_estimations) : '—'}</td>
        `;
        const actionsCell = document.createElement("td");
        const editButton = document.createElement("button");
        editButton.textContent = "✎";
        editButton.classList.add("btn", "ghost");
        editButton.addEventListener("click", () => {
          stockage.sauvegarder("produitÀÉditer", JSON.stringify(produit));
          window.location.href = `./edition_produit.html?produit=${produit.nom}`;
        });
        const deleteButton = document.createElement("button");
        deleteButton.textContent = "🗑";
        deleteButton.classList.add("btn", "warning");
        deleteButton.addEventListener("click", async () => {
          if (confirm(i18n.t('produits.confirmationSuppression').replace('{nom}', produit.nom))) {
            usine.supprimeProduit(produit.nom);
            await stockage.sauvegarderUsine(usine);
            location.reload();
          }
        });
        actionsCell.appendChild(editButton);
        actionsCell.appendChild(deleteButton);
        ligne.appendChild(actionsCell);
        corpsTableauProduits.appendChild(ligne);
      });
    }

    // Recherche en temps réel
    searchInput.addEventListener('input', afficherProduits);

    // Appliquer les traductions
    function appliquerTraductions() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const clé = el.getAttribute('data-i18n');
        el.textContent = i18n.t(clé);
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const clé = el.getAttribute('data-i18n-placeholder');
        el.placeholder = i18n.t(clé);
      });
    }

    function alimenterSelecteurLangue() {
      const select = document.getElementById('select-langue');
      select.innerHTML = '';
      const labels = { fr: 'Français', en: 'English', de: 'Deutsch', es: 'Español' };
      i18n.localesDisponibles.forEach(code => {
        const option = document.createElement('option');
        option.value = code;
        option.textContent = labels[code] || code.toUpperCase();
        if (code === i18n.locale) {
          option.selected = true;
        }
        select.appendChild(option);
      });
    }

    appliquerTraductions();
    alimenterSelecteurLangue();

    document.getElementById('select-langue').addEventListener('change', async (event) => {
      await i18n.changerLocale(event.target.value);
      appliquerTraductions();
      alimenterSelecteurLangue();
    });

    // Affichage initial
    afficherProduits();
  </script>
</body>

</html>
