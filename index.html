<!doctype html>
<html lang="fr" data-bs-theme="dark">

<head>
  <title>Gestion de l'usine</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="./style/style.css" />
</head>

<body>
  <nav>
    <div>
      <span class="h1" id="nav-nomUsine">[Nom de l'usine]</span>
      <a href="./index.html" class="btn" id="nav-accueil">Accueil</a>
      <a href="./marché.html" class="btn ghost" id="nav-marché">Marché</a>
      <a href="./produits.html" class="btn ghost" id="nav-produits">Produits</a>
      <a href="./stock.html" class="btn ghost" id="nav-stock">Stock</a>
      <a href="./planification.html" class="btn ghost" id="nav-planification">Planification</a>
    </div>
  </nav>

  <main>
    <div class="grid">
      <div>
        <label for="input-nomUsine">Nom de l'usine</label>
        <input type="text" id="input-nomUsine" />
      </div>
      <div>
        <label for="input-nbProduits">Nombre de produits</label>
        <input id="input-nbProduits" type="number" readonly></input>
      </div>
      <div>
        <label for="input-nbMarché">Nombre de valeurs de marché</label>
        <input id="input-nbMarché" type="number" readonly></input>
      </div>
      <div>
        <label for="input-nbStock">Nombre de type d'objets en stock</label>
        <input id="input-nbStock" type="number" readonly></input>
      </div>
      <div>
        <label for="input-liquidités">Liquidités disponibles</label>
        <input id="input-liquidités" type="number" readonly></input>
      </div>
    </div>

    <section id="section-fabrications" aria-labelledby="titre-fabrications">
      <h2 id="titre-fabrications">Fabrications en cours</h2>
      <div id="liste-fabrications"></div>
    </section>
  </main>

  <footer><span>Gestion des données</span>
    <button type="button" class="btn warning" id="button-reset">Reset</button>
  </footer>

  <script type="module">
    import { Usine } from "./app/service.js"
    import { notifier } from "./app/presentation.js"
    import { Stockage } from "./app/storage.js"

    const stockage = new Stockage();
    const usine = Usine.parse(stockage.lireUsine() || new Usine("He's alive !").toString());

    init();

    // Auclic sur le bouton "reset", supression de l'usine persistée pour la remplacer par une usine vide
    document.querySelector("#input-nomUsine").addEventListener("change", (event) => {
      save();
    });
    // Auclic sur le bouton "reset", supression de l'usine persistée pour la remplacer par une usine vide
    document.querySelector("#button-reset").addEventListener("click", () => {
      stockage.sauvegarderUsine(new Usine("Red is DED"));
      window.location.reload();
    });

    // initialisation des parties du DOM qui sont dynamiques
    function init() {
      document.getElementById("nav-nomUsine").innerText = usine.nom;
      document.getElementById("input-nomUsine").value = usine.nom;

      document.getElementById("input-nbProduits").value = usine.produits.length;
      document.getElementById("input-nbMarché").value = usine.tarifs.length;
      document.getElementById("input-nbStock").value = usine.stock.length;
      document.getElementById("input-liquidités").value = usine.liquidités;

      afficherFabrications();
    }

    /**
     * Construit et affiche le résumé des fabrications en cours.
     * Pour chaque fabrication, liste les prochaines étapes réalisables en priorité,
     * puis les étapes restantes.
     */
    function afficherFabrications() {
      const conteneur = document.getElementById("liste-fabrications");
      const fabrications = usine.fabrications;

      conteneur.innerHTML = "";

      if (fabrications.length === 0) {
        const vide = document.createElement("p");
        vide.className = "empty";
        vide.textContent = "Aucune fabrication en cours.";
        conteneur.appendChild(vide);
        return;
      }

      for (const fabrication of fabrications) {
        const carte = document.createElement("div");
        carte.className = "fabrication-carte";
        carte.setAttribute("data-fabrication-id", fabrication.id);

        // En-tête : nom du produit + quantité cible
        const entête = document.createElement("div");
        entête.className = "fabrication-entête";
        const titre = document.createElement("strong");
        titre.textContent = `${fabrication.nomProduit} × ${fabrication.quantité}`;
        entête.appendChild(titre);
        carte.appendChild(entête);

        // Tableau des étapes
        const étapes = fabrication.étapes;
        if (étapes && étapes.length > 0) {
          const table = document.createElement("table");
          table.setAttribute("aria-label", `Étapes de fabrication pour ${fabrication.nomProduit}`);

          const thead = document.createElement("thead");
          thead.innerHTML = `<tr>
            <th scope="col">Composant</th>
            <th scope="col">Quantité</th>
            <th scope="col">Action</th>
            <th scope="col">Statut</th>
          </tr>`;
          table.appendChild(thead);

          const tbody = document.createElement("tbody");

          // Trier : étapes réalisables en premier (déjà triées par planificateur, on respecte cet ordre)
          for (const étape of étapes) {
            const tr = document.createElement("tr");

            const tdNom = document.createElement("td");
            tdNom.textContent = étape.nom;
            tr.appendChild(tdNom);

            const tdQté = document.createElement("td");
            tdQté.textContent = étape.quantité;
            tr.appendChild(tdQté);

            const tdDécision = document.createElement("td");
            tdDécision.textContent = étape.décision === "BUILD" ? "Fabriquer" : "Acheter";
            tr.appendChild(tdDécision);

            const tdStatut = document.createElement("td");
            if (étape.réalisable) {
              tdStatut.textContent = "✓ Disponible";
              tdStatut.className = "green";
            } else if (étape.décision === "BUY" && étape.déficit > 0) {
              tdStatut.textContent = `Manque ${étape.déficit}`;
              tdStatut.className = "red";
            } else {
              tdStatut.textContent = "À planifier";
              tdStatut.className = "muted";
            }
            tr.appendChild(tdStatut);

            tbody.appendChild(tr);
          }

          table.appendChild(tbody);
          carte.appendChild(table);
        }

        conteneur.appendChild(carte);
      }
    }

    function save() {
      usine.nom = document.querySelector("#input-nomUsine").value;
      stockage.sauvegarderUsine(usine);
      init();
    }
  </script>
</body>

</html>
