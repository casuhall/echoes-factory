<!doctype html>
<html lang="fr" data-bs-theme="dark">

<head>
  <title>Gestion de l'usine</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="./style/style.css" />
</head>

<body>
  <nav>
    <div>
      <span class="h1" id="nav-nomUsine">[Nom de l'usine]</span>
      <a href="./index.html" class="btn" id="nav-accueil">Accueil</a>
      <a href="./marché.html" class="btn ghost" id="nav-marché">Marché</a>
      <a href="./produits.html" class="btn ghost" id="nav-produits">Produits</a>
      <a href="./stock.html" class="btn ghost" id="nav-stock">Stock</a>
      <a href="./planification.html" class="btn ghost" id="nav-planification">Planification</a>
    </div>
  </nav>

  <main>
    <div class="grid">
      <div>
        <label for="input-nomUsine">Nom de l'usine</label>
        <input type="text" id="input-nomUsine" />
      </div>
      <div>
        <label for="input-nbProduits">Nombre de produits</label>
        <input id="input-nbProduits" type="number" readonly></input>
      </div>
      <div>
        <label for="input-nbMarché">Nombre de valeurs de marché</label>
        <input id="input-nbMarché" type="number" readonly></input>
      </div>
      <div>
        <label for="input-nbStock">Nombre de type d'objets en stock</label>
        <input id="input-nbStock" type="number" readonly></input>
      </div>
      <div>
        <label for="input-liquidités">Liquidités disponibles</label>
        <input id="input-liquidités" type="number" readonly></input>
      </div>
    </div>

  </main>

  <footer><span>Gestion des données</span>
    <button type="button" class="btn warning" id="button-reset">Reset</button>
  </footer>

  <section id="section-pantry" style="margin-top: 16px;">
    <h3>Stockage Pantry (optionnel)</h3>
    <div class="grid">
      <div>
        <label for="input-pantry-id">Identifiant Pantry</label>
        <input type="text" id="input-pantry-id" placeholder="Entrez votre identifiant Pantry" />
      </div>
      <div style="display: flex; align-items: flex-end;">
        <button type="button" class="btn" id="button-associer-pantry">Associer Pantry</button>
      </div>
    </div>
    <p id="status-pantry" style="margin-top: 8px;"></p>
  </section>

  <script type="module">
    import { Usine } from "./app/service.js"
    import { notifier } from "./app/presentation.js"
    import { Stockage } from "./app/storage.js"
    import { associerPantry } from "./app/storage.js"

    const stockage = new Stockage(Stockage.lirePantryId());
    const usine = Usine.parse(stockage.lireUsine() || new Usine("He's alive !").toString());

    init();

    // Auclic sur le bouton "reset", supression de l'usine persistée pour la remplacer par une usine vide
    document.querySelector("#input-nomUsine").addEventListener("change", (event) => {
      save();
    });
    // Affichage du statut Pantry
    function mettreAJourStatutPantry() {
      const status = document.getElementById("status-pantry");
      const pantryId = Stockage.lirePantryId();
      if (pantryId) {
        status.textContent = `Mode Pantry actif (identifiant : ${pantryId})`;
      } else {
        status.textContent = "Mode local actif (pas de Pantry associé)";
      }
    }

    mettreAJourStatutPantry();

    // Clic sur le bouton "Associer Pantry"
    document.querySelector("#button-associer-pantry").addEventListener("click", async () => {
      const identifiant = document.querySelector("#input-pantry-id").value.trim();
      if (!identifiant) {
        notifier("Veuillez saisir un identifiant Pantry.", "warn");
        return;
      }
      try {
        const résultat = await associerPantry(identifiant);
        if (résultat.conflit) {
          // Règle 5 : demander à l'utilisateur
          const choix = confirm("Les données locales et Pantry contiennent toutes deux des données valides.\n\nOK = garder Pantry\nAnnuler = garder local");
          if (choix) {
            // Garder Pantry
            Stockage.mémoriserPantryId(identifiant);
            notifier("Pantry associé (données Pantry conservées).", "info");
          } else {
            // Garder local : transférer les données locales vers le Pantry
            Stockage.mémoriserPantryId(identifiant);
            const stockagePantry = new Stockage(identifiant);
            const donnéesLocales = localStorage.getItem("usine");
            if (donnéesLocales) {
              await stockagePantry.sauvegarderUsine(Usine.parse(donnéesLocales));
            }
            notifier("Pantry associé (données locales conservées).", "info");
          }
        } else {
          notifier("Pantry associé avec succès.", "info");
        }
        mettreAJourStatutPantry();
      } catch (erreur) {
        notifier(`Erreur lors de l'association Pantry : ${erreur.message}`, "error");
      }
    });
      // Clic sur le bouton "reset", suppression de l'usine persistée pour la remplacer par une usine vide
      document.querySelector("#button-reset").addEventListener("click", () => {
      stockage.sauvegarderUsine(new Usine("Red is DED"));
      window.location.reload();
      });

    // initialisation des parties du DOM qui sont dynamiques
    function init() {
      document.getElementById("nav-nomUsine").innerText = usine.nom;
      document.getElementById("input-nomUsine").value = usine.nom;

      document.getElementById("input-nbProduits").value = usine.produits.length;
      document.getElementById("input-nbMarché").value = usine.tarifs.length;
      document.getElementById("input-nbStock").value = usine.stock.length;
      document.getElementById("input-liquidités").value = usine.liquidités;
    }

    function save() {
      usine.nom = document.querySelector("#input-nomUsine").value;
      stockage.sauvegarderUsine(usine);
      init();
    }
  </script>
</body>

</html>
